services:
  app:
    image: ml-trading:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PYTHON: /opt/venv/bin/python
    ports:
      - "127.0.0.1:${DOCKER_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./models:/app/models
      - ./train_gpu.py:/app/train_gpu.py:ro
